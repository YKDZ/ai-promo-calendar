name: Prepare Catalog Update

on:
  push:
    branches:
      - "catalog-update/**"
  workflow_dispatch:
    inputs:
      target_branch:
        description: 已包含数据修改的 catalog-update/ 分支
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-catalog-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Format and validate catalog data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
    steps:
      - name: Validate target branch name
        run: |
          case "$TARGET_BRANCH" in
            catalog-update/?*) ;;
            *)
              echo "目标分支必须以 catalog-update/ 开头，且前缀后不能为空。" >&2
              exit 1
              ;;
          esac
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0
      - name: Verify branch base and input scope
        env:
          CATALOG_HEAD_REF: ${{ env.TARGET_BRANCH }}
          CATALOG_SCOPE_BASE: origin/main
          CATALOG_SCOPE_INCLUDE_WORKTREE: "true"
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "目标分支必须包含最新 main；请从最新 main 重新创建或更新分支。" >&2
            exit 1
          fi
          node catalog/src/pr-scope.ts
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format catalog files
        run: pnpm --filter @ai-promo-calendar/catalog format:write
      - name: Verify formatted scope
        env:
          CATALOG_HEAD_REF: ${{ env.TARGET_BRANCH }}
          CATALOG_SCOPE_BASE: origin/main
          CATALOG_SCOPE_INCLUDE_WORKTREE: "true"
        run: node catalog/src/pr-scope.ts
      - name: Validate catalog data
        run: |
          pnpm --filter @ai-promo-calendar/catalog format:check
          pnpm run validate:catalog
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "目录数据无需格式修正。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- catalog/discovery.json catalog/channels catalog/benefits
          git commit -m "chore(catalog): format maintenance data"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
