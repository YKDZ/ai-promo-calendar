name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    name: Validate Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate catalog
        run: pnpm run validate:catalog

  catalog-pr-scope:
    name: Catalog PR Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check changed file scope
        env:
          CATALOG_HEAD_REF: ${{ github.head_ref }}
        run: node catalog/src/pr-scope.ts

  check:
    name: Root Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @ai-promo-calendar/web exec playwright install --with-deps chromium
      - name: Run Root Check
        run: pnpm run check
      - name: Stage Root Check diagnostics
        if: failure()
        env:
          DIAGNOSTIC_OWNER_PATHS: |-
            apps/web
        run: |
          rm -rf .template-ci-diagnostics
          mkdir -p .template-ci-diagnostics
          printf '%s\n' "$DIAGNOSTIC_OWNER_PATHS" | while IFS= read -r owner_path; do
            for diagnostic_directory in test-results playwright-report; do
              source_path="$owner_path/$diagnostic_directory"
              destination_path=".template-ci-diagnostics/$owner_path/$diagnostic_directory"
              if [ -d "$source_path" ]; then
                mkdir -p "$(dirname "$destination_path")"
                cp -R "$source_path" "$destination_path"
              fi
            done
          done
      - name: Upload Root Check diagnostics
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: root-check-diagnostics
          path: .template-ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7
